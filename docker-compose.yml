services:
  localstack:
    image: localstack/localstack:4.3
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=0
    volumes:
      - "./.localstack:/var/lib/localstack"
      # Not needed for S3:
      # - "/var/run/docker.sock:/var/run/docker.sock"
    post_start:
      - command: awslocal s3api create-bucket --bucket labtech-dev-bucket
  spark-master:
    build: "./docker/spark"
    environment:
      SPARK_MODE: "master"
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "127.0.0.1:8080:8080" # Dashboard
      - "127.0.0.1:7077:7077" # Cluster comms
    command: "/opt/spark/sbin/start-master.sh"
  spark-worker:
    build: "./docker/spark"
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: "worker"
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: 2
    command: "/opt/spark/sbin/start-worker.sh spark://spark-master:7077"
    ports:
      - "127.0.0.1::8081" # Dashboard
    volumes:
      - "./examples/storage:/opt/spark/shared-storage"
      # Mount dev version of labtech into venv.
      - "./labtech:/home/spark/.venv/lib/python3.11/site-packages/labtech"
    deploy:
      replicas: 3
  spark-connect:
    build: "./docker/spark"
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "127.0.0.1:15002:15002"
      - "127.0.0.1:4040:4040"
    # The total-executor-cores must be limited, otherwise it will
    # consume all and not leave room for other Spark drivers.
    command: >
      /opt/spark/sbin/start-connect-server.sh
      --master spark://spark-master:7077
      --conf spark.connect.grpc.binding.port=15002
      --total-executor-cores 3
